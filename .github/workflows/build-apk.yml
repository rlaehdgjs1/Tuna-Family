name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tuna-Family-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuna-Family-APK
          path: build/app/outputs/flutter-apk/Tuna-Family-v1.0.0.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "🐟 참치패밀리 (Tuna Family) v1.0.0 APK"
          body: |
            ## 🐟 참치패밀리 (Tuna Family) v1.0.0 안드로이드 공식 설치 파일
            
            ### ✨ 주요 기능
            - 📋 **중요 공지 상단 고정 & 카테고리별 공지 보드**
            - 📩 **'확인했어요' (수신 확인) 및 가족 확인율 실시간 통계**
            - 🗳️ **일정/모임 참석 및 메뉴 투표 (`PollWidget`)**
            - ❤️ **이모지 반응 & 가족 댓글 소통**
            - 👥 **가족 구성원 추가/수정/삭제 및 프로필 전환**
            - 🎵 **배경음악 플레이어 및 내 음악 파일 선택 기능**
            
            ### 📱 설치 방법
            1. 아래의 `Tuna-Family-v1.0.0.apk` 파일을 안드로이드 스마트폰에 다운로드합니다.
            2. 다운로드된 APK 파일을 터치하여 설치합니다 (출처를 알 수 없는 앱 설치 허용 필요).
          files: build/app/outputs/flutter-apk/Tuna-Family-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
